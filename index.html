<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>relay.fizx.uk</title>
  <meta name="description" content="Nostr relay at relay.fizx.uk — stats, supported NIPs, and reachability." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='25' height='25' rx='4' fill='%2334d399'/%3E%3Crect x='35' y='4' width='25' height='25' rx='4' fill='%23a78bfa'/%3E%3Crect x='4' y='35' width='25' height='25' rx='4' fill='%2334d399'/%3E%3Crect x='35' y='35' width='25' height='25' rx='4' fill='%2334d399'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg:      #0d1117;
      --card:    #131d2a;
      --border:  #1e2d3d;
      --fg:      #e6edf3;
      --muted:   #7d8590;
      --primary: #34d399;
      --accent:  #a78bfa;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--primary); }

    .gradient-letter {
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .hero-row h1 { margin-bottom: 0; }
    .nstart-hand { display: inline-block; flex-shrink: 0; opacity: 1; transition: opacity 0.15s; }
    .nstart-hand:hover { opacity: 0.75; }
    .nstart-hand svg { height: 122px; width: auto; display: block; }

    /* ── Nav ── */
    nav { border-bottom: 1px solid var(--border); padding: 16px 24px; }
    .nav-inner {
      max-width: 1024px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-home {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .nav-home:hover { color: var(--primary); }
    .nav-links {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      overflow-x: auto;
    }
    .nav-links a { color: var(--muted); white-space: nowrap; }
    .nav-links a:hover { color: var(--primary); }
    .nav-right {
      flex-shrink: 0;
      min-width: 28px;
      display: flex;
      justify-content: flex-end;
    }
    @media (min-width: 600px) { .nav-right { min-width: 184px; } }
    .nav-github {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      color: rgba(125,133,144,0.6);
      transition: color 0.15s;
    }
    .nav-github:hover { color: var(--primary); }
    .nostr-login-btn {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .nostr-login-btn { display: flex; align-items: center; }
    .nostr-login-btn:hover { border-color: var(--primary); color: var(--primary); }
    .nostr-login-btn.connected { border-color: var(--primary); color: var(--primary); opacity: 0.7; display: flex; align-items: center; gap: 6px; }
    @media (max-width: 600px) { .login-label { display: none; } }
    .nostr-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }

    /* ── Main ── */
    main {
      flex: 1;
      max-width: 1024px;
      margin: 0 auto;
      width: 100%;
      padding: 40px 24px 56px;
    }

    /* ── Hero ── */
    .hero { margin-bottom: 24px; }
    h1 {
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-size: clamp(48px, 10vw, 68px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 8px;
    }
    @keyframes titleLetterIn {
      from { transform: translateX(-80px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
    @keyframes titleSuffixIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    h1 .tl        { display: inline-block; animation: titleLetterIn  350ms cubic-bezier(0.22,1,0.36,1) both; }
    h1 .tl-suffix { display: inline-block; animation: titleSuffixIn  600ms cubic-bezier(0.22,1,0.36,1) both; }
    .hero-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .dash-row { display: flex; align-items: center; gap: 12px; }
    .dash-row::before { content: ''; display: inline-block; width: calc((100% - 60px) / 21); height: 2px; background: var(--primary); opacity: 0.5; flex-shrink: 0; }

    /* ── 21-bar ── */
    .bar-21 { display: flex; gap: 3px; margin-bottom: 12px; }
    .bar-21-seg { flex: 1; height: 2px; transition: background-color 0.3s; }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 36px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: var(--card);
      flex-wrap: wrap;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.checking { background: var(--accent); animation: blink 1s ease-in-out infinite; }
    .dot.online   { background: var(--primary); box-shadow: 0 0 7px rgba(52,211,153,0.5); }
    .dot.offline  { background: #f87171; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #status-label { color: var(--fg); font-weight: 500; }
    #status-meta  { margin-left: auto; color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 10px; }
    .refresh-btn {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .refresh-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Sections ── */
    .section { margin-bottom: 32px; }
    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Info table ── */
    .info-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .info-table tr { border-top: 1px solid var(--border); }
    .info-table tr:last-child { border-bottom: 1px solid var(--border); }
    .info-table td { padding: 9px 4px; vertical-align: top; }
    .info-table .key { color: var(--muted); width: 130px; padding-right: 16px; white-space: nowrap; }
    .info-table .val { color: var(--fg); }
    .info-table .val a { color: var(--accent); }
    .info-table .val a:hover { color: var(--primary); }

    /* ── NIP badges ── */
    .nip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .nip-badge {
      font-size: 10px;
      border: 1px solid rgba(167,139,250,0.3);
      padding: 5px 9px;
      color: rgba(167,139,250,0.8);
      cursor: default;
      transition: border-color 0.15s, color 0.15s;
      line-height: 1.3;
    }
    .nip-badge:hover { border-color: var(--accent); color: var(--accent); }
    .nip-badge.grasp {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(167,139,250,0.1);
    }
    .nip-num  { color: var(--accent); display: block; font-weight: 600; }
    .nip-desc { font-size: 9px; display: block; margin-top: 1px; opacity: 0.7; }
    .grasp-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent);
      opacity: 0.7;
      display: block;
      margin-top: 2px;
    }

    /* ── GRASP badge in status bar ── */
    .grasp-badge {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 3px 7px;
      border: 1px solid rgba(167,139,250,0.6);
      color: var(--accent);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      cursor: pointer;
      line-height: 1.4;
      display: inline-flex;
      align-items: center;
    }
    .grasp-badge:hover {
      border-color: var(--accent);
      background: rgba(167,139,250,0.1);
    }
    .grasp-badge[hidden] { display: none !important; }

    /* ── CTA link ── */
    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
    }
    .cta-link:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Footer ── */
    footer { border-top: 1px solid var(--border); padding: 16px 24px; }
    .footer-inner {
      max-width: 1024px;
      margin: 0 auto;
      text-align: center;
    }

    @media (max-width: 500px) {
      #status-url { display: none; }
    }
  </style>
</head>

      </div>
      <div class="bar-21" id="bar-21"></div>
      <div class="dash-row"><p class="hero-sub" style="margin-top:0">nostr-rs-relay · relay.fizx.uk</p></div>
    </div>

    <div class="status-bar">
      <div class="dot checking" id="dot"></div>
      <span id="status-label">checking…</span>
      <a href="https://github.com/nostr-protocol/nips/blob/master/34.md"
         target="_blank" rel="noopener noreferrer"
         class="grasp-badge" id="grasp-badge" hidden
         title="GRASP — relay accepts NIP-34 git events">GRASP</a>
      <div id="status-meta">
        <span id="status-detail" style="font-size:11px;color:var(--muted);opacity:0.6"></span>
        <span id="status-checked" style="font-size:10px;color:var(--muted);opacity:0.4"></span>
        <button class="refresh-btn" id="refresh-btn" onclick="startCheck()">↻ refresh</button>
      </div>
    </div>

    <div class="section">
      <div class="dash-row" style="margin-bottom:12px"><p class="section-label" style="margin-bottom:0">Relay info</p></div>
      <table class="info-table">
        <tr><td class="key">name</td>             <td class="val" id="i-name">—</td></tr>
        <tr><td class="key">url</td>              <td class="val" id="i-url">—</td></tr>
        <tr><td class="key">software</td>         <td class="val" id="i-software">—</td></tr>
        <tr><td class="key">version</td>          <td class="val" id="i-version">—</td></tr>
        <tr><td class="key">contact</td>          <td class="val" id="i-contact">—</td></tr>
        <tr><td class="key">description</td>      <td class="val" id="i-desc">—</td></tr>
        <tr><td class="key">payment</td>          <td class="val" id="i-payment">—</td></tr>
        <tr><td class="key">restricted writes</td><td class="val" id="i-restricted">—</td></tr>
      </table>
    </div>

    <div class="section">
      <div class="dash-row" style="margin-bottom:12px"><p class="section-label" style="margin-bottom:0">Supported NIPs</p></div>
      <div class="nip-grid" id="nip-grid">
        <span style="font-size:11px;color:var(--muted)">loading…</span>
      </div>
    </div>


  </main>

  <footer>
    <div class="footer-inner">
      <p style="font-size:11px;color:var(--primary);opacity:0.6;">✦ built with claude</p>
    </div>
  </footer>

  <script>
    /* ── Animated title ── */
    (function() {
      const el = document.getElementById('site-title');
      if (!el) return;
      const accent = 'relay';
      const rest = '.fizx.uk';
      const all = (accent + rest).split('');
      const letterDuration = 350;
      const stagger = all.length > 1 ? (1200 - letterDuration) / (all.length - 1) : 0;
      const fromRgb = [0x4a, 0xde, 0x80];
      const toRgb   = [0xe8, 0x79, 0xf9];
      const lerp = (a, b, t) => `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
      const aLen = accent.length;
      const prefixHtml = accent.split('').map((ch, i) => {
        const start = lerp(fromRgb, toRgb, aLen > 0 ? i / aLen : 0);
        const end   = lerp(fromRgb, toRgb, aLen > 0 ? (i + 1) / aLen : 1);
        return `<span class="tl gradient-letter" style="background:linear-gradient(to right,${start},${end});animation-delay:${Math.round(i * stagger)}ms">${ch}</span>`;
      }).join('');
      const suffixHtml = rest.split('').map((ch, i) => {
        const idx = accent.length + i;
        return `<span class="tl-suffix" style="color:rgba(232,121,249,0.2);animation-delay:${Math.round(idx * stagger)}ms">${ch}</span>`;
      }).join('');
      el.innerHTML = `${prefixHtml}${suffixHtml}`;
    })();

    /* ── NIP-07 Nostr login ── */
    (function() {
      const KEY = 'nostr_pubkey';
      const root = document.getElementById('login-bar');
      if (!root) return;

      // NIP-55 callback check
      (() => {
        try {
          const p = new URLSearchParams(window.location.search);
          const nip55 = p.get('nostr_pk');
          if (nip55) { localStorage.setItem(KEY, nip55); window.history.replaceState({}, '', window.location.pathname); }
        } catch {}
      })();

      function render(pubkey) {
        if (pubkey) {
          root.innerHTML = `<button class="nostr-login-btn connected" id="nostr-btn">
        <span class="nostr-dot"></span>${pubkey.slice(0,8)}…<span style="opacity:0.4;margin-left:2px">×</span>
      </button>`;
          document.getElementById('nostr-btn').onclick = () => {
            localStorage.removeItem(KEY);
            render(null);
          };
        } else {
          root.innerHTML = `<div style="display:flex"><button class="nostr-login-btn" id="nostr-btn-ext"><svg style="width:11px;height:11px;flex-shrink:0;vertical-align:middle;margin-right:5px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="login-label">ext</span></button><button class="nostr-login-btn" id="nostr-btn-app" style="border-left:none"><svg style="width:11px;height:11px;flex-shrink:0;vertical-align:middle;margin-right:5px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg><span class="login-label">app</span></button></div>`;
          document.getElementById('nostr-btn-ext').onclick = async () => {
            try {
              const pk = await window.nostr.getPublicKey();
              if (pk) { localStorage.setItem(KEY, pk); render(pk); }
            } catch {}
          };
          document.getElementById('nostr-btn-app').onclick = () => {
            const cb = `${location.origin}${location.pathname}?nostr_pk={signature}`;
            location.href = `nostrsigner:getpubkey?compressionType=none&returnType=signature&type=get_public_key&callbackUrl=${encodeURIComponent(cb)}`;
          };
        }
      }

      const saved = (() => { try { return localStorage.getItem(KEY); } catch { return null; } })();
      render(saved);
    })();

    /* ── NIP descriptions ── */
    const NIP_NAMES = {
      1:'Basic Protocol', 2:'Contact Lists', 3:'OpenTimestamps',
      4:'Encrypted DMs', 5:'Mapping to DNS', 6:'Reposts', 7:'Reactions',
      8:'Mentions', 9:'Event Deletion', 10:'Reply Conventions',
      11:'Relay Info', 12:'Generic Tag Queries', 13:'Proof of Work',
      14:'Subject Tag', 15:'End of Stored Events', 16:'Event Treatment',
      17:'Private DMs', 18:'Reposts', 20:'Command Results',
      21:'nostr: URI', 22:'Created_at Limits', 23:'Long-form Content',
      25:'Reactions', 26:'Delegated Events', 27:'Text Note References',
      28:'Public Chats', 29:'Groups', 30:'Custom Emoji',
      31:'Labelling', 33:'Parameterized Replaceable', 34:'Git',
      36:'Sensitive Content', 38:'User Statuses', 39:'External Identities',
      40:'Expiration Timestamp', 42:'Auth', 44:'Versioned Encryption',
      45:'Event Counts', 46:'Remote Signing', 47:'Wallet Connect',
      50:'Keywords', 51:'Lists', 52:'Calendar', 53:'Live Activities',
      57:'Zaps', 58:'Badges', 59:'Gift Wrap', 65:'Relay List Metadata',
      70:'Protected Events', 71:'Video Events', 72:'Moderated Communities',
      75:'Zap Goals', 78:'App-specific Data', 89:'App Handlers',
      90:'Data Vending Machines', 94:'File Metadata', 96:'HTTP File Storage',
      98:'HTTP Auth', 99:'Classified Listings',
    };

    /* ── Fetch NIP-11 info ── */
    fetch(location.origin, { headers: { Accept: 'application/nostr+json' } })
      .then(r => r.json())
      .then(info => {
        const set = (id, text) => {
          const el = document.getElementById(id);
          if (el) el.textContent = text || '—';
        };
        const setHtml = (id, html) => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = html;
        };

        set('i-name', info.name);
        set('i-url',  info.relay_url);

        if (info.software) {
          const label = info.software.includes('nostr-rs-relay') ? 'nostr-rs-relay'
                      : info.software.split('/').pop().replace(/\.git$/, '');
          setHtml('i-software', `<a href="${info.software}">${label}</a>`);
        }

        set('i-version',    info.version);
        set('i-contact',    info.contact);
        set('i-desc',       (info.description || '').replace(/\s+/g, ' ').trim());
        set('i-payment',    info.limitation?.payment_required    ? 'required'  : 'not required');
        set('i-restricted', info.limitation?.restricted_writes   ? 'yes'       : 'no');

        const grid = document.getElementById('nip-grid');
        const nips = info.supported_nips;
        if (Array.isArray(nips) && nips.length) {
          // GRASP indicator: relay accepts NIP-34 git events
          const isGrasp = nips.includes(34);
          const graspBadge = document.getElementById('grasp-badge');
          if (graspBadge && isGrasp) graspBadge.hidden = false;

          grid.innerHTML = nips.slice().sort((a, b) => a - b).map(n => {
            const desc = NIP_NAMES[n] || '';
            const num  = String(n).padStart(2, '0');
            const grasp = n === 34;
            const cls = grasp ? 'nip-badge grasp' : 'nip-badge';
            const title = `NIP-${num}${desc ? ': ' + desc : ''}${grasp ? ' (GRASP)' : ''}`;
            const graspTag = grasp ? '<span class="grasp-tag">GRASP</span>' : '';
            return `<span class="${cls}" title="${title}">
              <span class="nip-num">NIP-${num}</span>${desc ? `<span class="nip-desc">${desc}</span>` : ''}${graspTag}
            </span>`;
          }).join('');
        } else {
          grid.textContent = 'none reported';
        }
      })
      .catch(() => {
        document.getElementById('nip-grid').innerHTML =
          '<span style="font-size:11px;color:#f87171">Could not load relay info</span>';
      });

    /* ── WebSocket reachability ── */
    let retryTimer = null;

    function startCheck() {
      const dot     = document.getElementById('dot');
      const label   = document.getElementById('status-label');
      const detail  = document.getElementById('status-detail');
      const checked = document.getElementById('status-checked');
      const wsUrl   = 'wss://relay.fizx.uk';

      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }

      dot.className = 'dot checking';
      label.textContent = 'checking…';
      detail.textContent = '';

      const t0 = Date.now();
      let resolved = false;

      const done = (state, text, detailText) => {
        if (resolved) return;
        resolved = true;
        clearTimeout(timer);
        dot.className = 'dot ' + state;
        label.textContent = text;
        detail.textContent = detailText || '';
        checked.textContent = 'checked ' + new Date().toLocaleTimeString();
        // Auto-retry: 30s on failure, 5min on success
        retryTimer = setTimeout(startCheck, state === 'online' ? 5 * 60 * 1000 : 30 * 1000);
      };

      const timer = setTimeout(
        () => done('offline', 'timed out', 'no response in 7s — relay may be unreachable'),
        7000
      );

      try {
        const ws = new WebSocket(wsUrl);
        ws.addEventListener('open', () => {
          const latency = Date.now() - t0;
          done('online', 'relay online', `${latency}ms · ${wsUrl}`);
          ws.close();
        });
        ws.addEventListener('error', () => done('offline', 'relay unreachable', 'WebSocket connection failed'));
      } catch (e) {
        done('offline', 'relay unreachable', String(e));
      }
    }

    startCheck();

    /* ── 21-bar animation ── */
    (function() {
      const EMERALD = [52, 211, 153], PURPLE = [167, 139, 250], N = 21;
      const lerp = (a, b, t) => `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
      const colors = Array.from({length: N}, (_, i) => { const t = i < 10 ? i/10 : (N-1-i)/10; return lerp(EMERALD, PURPLE, t); });
      const bar = document.getElementById('bar-21');
      const segs = Array.from({length: N}, () => {
        const d = document.createElement('div'); d.className = 'bar-21-seg'; d.style.backgroundColor = '#161e2e'; bar.appendChild(d); return d;
      });
      let tick = 0;
      setInterval(() => { tick = tick < N ? tick + 1 : 0; segs.forEach((s, i) => { s.style.backgroundColor = i < tick ? colors[i] : '#161e2e'; }); }, 1000);
    })();
  </script>

</body>
</html>
